# Fluent Bit log pipeline: container stdout/stderr -> JSON parse -> Loki.
# Compatible with src/main.py JSON schema:
#   timestamp, level, logger, message, method, url, status_code, duration_ms
#   (+ optional traceback). Missing fields are tolerated (Reserve_Data On).

[SERVICE]
    Flush        1
    Log_Level    info
    Daemon       off
    Http_Server  Off

# Container log streams (Docker / Kubernetes node log paths).
[INPUT]
    Name              tail
    Path              /var/log/containers/*.log
    Tag               kube.*
    Parser            docker
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  5

# Parse structured app JSON carried in the container runtime `log` field.
# Required keys handled at minimum: level, status_code, message, duration_ms.
# Full keys handled: timestamp, level, logger, message, method, url,
# status_code, duration_ms (+ optional traceback passthrough).
[FILTER]
    Name       parser
    Match      kube.*
    Key_Name   log
    Parser     app-json
    Reserve_Data On
    Preserve_Key On

# JSON parser matching src/main.py JsonFormatter output (single-line JSON).
[PARSER]
    Name       app-json
    Format     json
    Time_Key   timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep  On

# Forward parsed streams to Loki (see docker/loki/loki-config.yaml).
[OUTPUT]
    Name       loki
    Match      kube.*
    Host       loki
    Port       3100
    Labels     job=fluent-bit
    Label_Keys level
    Auto_Kubernetes_Labels Off
